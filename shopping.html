<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#b99545">
    <meta name="description" content="&#36023;&#12356;&#29289;&#12522;&#12473;&#12488;">
    <title>Weekly ToDo Shopping</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="stylesheet" href="style.css">
    <script src="shopping.js" defer></script>
  </head>
  <body class="shopping-page-body">
    <header class="app-header shopping-header">
      <div>
        <p class="eyebrow">Shopping</p>
        <h1>&#36023;&#12356;&#29289;&#12522;&#12473;&#12488;</h1>
      </div>
      <a class="icon-button shopping-back" href="index.html" aria-label="&#12513;&#12452;&#12531;&#30011;&#38754;&#12408;&#25147;&#12427;">&#8249;</a>
    </header>

    <main class="shopping-page">
      <form class="shopping-form shopping-main-form" id="shoppingForm">
        <input id="shoppingInput" type="text" maxlength="60" autocomplete="off" placeholder="&#36023;&#12358;&#12418;&#12398;&#12434;&#36861;&#21152;">
        <button type="submit">&#36861;&#21152;</button>
      </form>

      <ul class="shopping-list shopping-main-list" id="shoppingList" aria-live="polite"></ul>

      <section class="shopping-stock-section" aria-label="&#12473;&#12488;&#12483;&#12463;&#20505;&#35036;">
        <ul class="shopping-list shopping-stock-list" id="shoppingStockList" aria-live="polite"></ul>
        <form class="shopping-form shopping-stock-form" id="shoppingStockForm">
          <input id="shoppingStockInput" type="text" maxlength="60" autocomplete="off" placeholder="&#12473;&#12488;&#12483;&#12463;&#20505;&#35036;&#12434;&#36861;&#21152;">
          <button type="submit">&#36861;&#21152;</button>
        </form>
      </section>
    </main>

    <template id="shoppingItemTemplate">
      <li class="shopping-item">
        <button class="shopping-handle" type="button" aria-label="&#20006;&#12403;&#26367;&#12360;"></button>
        <span class="shopping-title"></span>
        <button class="shopping-delete" type="button" aria-label="&#21066;&#38500;">&#215;</button>
      </li>
    </template>
  </body>
</html>
