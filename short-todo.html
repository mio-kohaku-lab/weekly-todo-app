<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#6f91ac">
    <meta name="description" content="&#30701;&#26399;ToDo;">
    <title>Weekly ToDo Short Tasks</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="stylesheet" href="style.css">
    <script src="short-todo.js" defer></script>
  </head>
  <body class="short-page-body">
    <header class="app-header short-header">
      <div>
        <p class="eyebrow">Short ToDo</p>
        <h1>&#30701;&#26399;ToDo</h1>
      </div>
      <a class="icon-button short-back" href="index.html" aria-label="&#12513;&#12452;&#12531;&#30011;&#38754;&#12408;&#25147;&#12427;">&#8249;</a>
    </header>

    <main class="short-page">
      <div class="short-tabs" aria-label="&#30701;&#26399;ToDo&#20999;&#12426;&#26367;&#12360;">
        <button class="short-tab" type="button" data-list="night">&#22812;</button>
        <button class="short-tab" type="button" data-list="one">1</button>
        <button class="short-tab" type="button" data-list="two">2</button>
        <button class="short-tab" type="button" data-list="three">3</button>
      </div>

      <form class="short-form" id="shortForm">
        <input id="shortInput" type="text" maxlength="60" autocomplete="off" placeholder="&#30701;&#26399;ToDo&#12434;&#36861;&#21152;">
        <button type="submit">&#36861;&#21152;</button>
      </form>

      <ul class="short-list" id="shortList" aria-live="polite"></ul>

      <button class="short-clear-button" id="shortClearButton" type="button">&#30701;&#26399;ToDo&#12434;&#31354;&#12395;&#12377;&#12427;</button>
    </main>

    <template id="shortItemTemplate">
      <li class="short-item">
        <button class="short-handle" type="button" aria-label="&#20006;&#12403;&#26367;&#12360;"></button>
        <input class="short-check" type="checkbox">
        <span class="short-title"></span>
      </li>
    </template>
  </body>
</html>
