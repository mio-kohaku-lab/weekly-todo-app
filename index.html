<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#477f7d">
    <meta name="description" content="&#12473;&#12510;&#12507;&#12391;&#20351;&#12358;&#36913;&#38291;ToDo&#12522;&#12473;&#12488;">
    <title>Weekly ToDo</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Weekly ToDo</p>
        <h1>&#20170;&#36913;&#12398;&#12479;&#12473;&#12463;</h1>
      </div>
      <nav class="header-actions" aria-label="App actions">
        <a class="icon-button" href="settings.html" aria-label="&#35373;&#23450;&#12434;&#38283;&#12367;">&#9881;</a>
        <a class="icon-button short-link" href="short-todo.html" aria-label="&#30701;&#26399;ToDo&#12434;&#38283;&#12367;"><span aria-hidden="true"></span></a>
        <a class="icon-button shopping-link" href="shopping.html" aria-label="&#36023;&#12356;&#29289;&#12522;&#12473;&#12488;&#12434;&#38283;&#12367;"><span aria-hidden="true"></span></a>
      </nav>
    </header>

    <main>
      <div class="day-strip" id="dayStrip" aria-live="polite"></div>

      <section class="long-memo-panel" aria-label="&#38263;&#26399;&#12513;&#12514;">
        <ul class="long-memo-list" id="longMemoList"></ul>
        <div class="long-memo-actions" aria-label="&#38263;&#26399;&#12513;&#12514;&#25805;&#20316;">
          <a class="long-memo-action long-memo-history" href="history.html" aria-label="&#38263;&#26399;&#12513;&#12514;&#23653;&#27508;&#12434;&#38283;&#12367;">&#9719;</a>
          <button class="long-memo-action long-memo-add" id="longMemoAddButton" type="button" aria-label="&#38263;&#26399;&#12513;&#12514;&#12434;&#36861;&#21152;">+</button>
        </div>
      </section>
    </main>

    <template id="dayTemplate">
      <section class="day-card">
        <div class="day-head">
          <h2></h2>
        </div>
        <ul class="task-list"></ul>
      </section>
    </template>
  </body>
</html>
